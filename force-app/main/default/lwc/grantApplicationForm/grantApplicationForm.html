<template>
    <lightning-card  variant="Narrow"  title="Grant Application Form" >
       
   
   
       <div class="slds-p-around_medium">
        <!-- Error Message Display -->
        <template if:true={hasError}>
            <div class="error-message">
                <lightning-icon icon-name="utility:error" alternative-text="Error"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>

        <!-- Success Message Display -->
        <template if:true={hasSuccess}>
            <div class="success-message">
                <lightning-icon icon-name="utility:success" alternative-text="Success"></lightning-icon>
                <span>{successMessage}</span>
            </div>
        </template>

        <!-- Form Content -->
        <template if:false={isSubmitted}>
            <form class="grant-form" onsubmit={handleSubmit}>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName" class="form-label">First Name<span class="required">*</span></label>
                        <input
                            id="firstName"
                            type="text"
                            class="form-input"
                            value={formData.firstName}
                            onchange={handleInputChange}
                            data-field="firstName"
                            required
                        />
                    </div>
                    <div class="form-group">
                        <label for="lastName" class="form-label">Last Name<span class="required">*</span></label>
                        <input
                            id="lastName"
                            type="text"
                            class="form-input"
                            value={formData.lastName}
                            onchange={handleInputChange}
                            data-field="lastName"
                            required
                        />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone" class="form-label">Phone<span class="required">*</span></label>
                        <input
                            id="phone"
                            type="tel"
                            class="form-input"
                            value={formData.phone}
                            onchange={handleInputChange}
                            data-field="phone"
                            placeholder="65xxxxxxxx"
                            required
                        />
                        <template if:true={phoneError}>
                            <span class="validation-error">{phoneErrorMsg}</span>
                        </template>
                    </div>
                    <div class="form-group">
                        <label for="postalCode" class="form-label">Postal Code<span class="required">*</span></label>
                        <input
                            id="postalCode"
                            type="text"
                            class="form-input"
                            value={formData.postalCode}
                            onchange={handleInputChange}
                            data-field="postalCode"
                            placeholder="6 digits"
                            required
                        />
                        <template if:true={postalError}>
                            <span class="validation-error">{postalErrorMsg}</span>
                        </template>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="monthlyIncome" class="form-label">Monthly Income (SGD)<span class="required">*</span></label>
                        <input
                            id="monthlyIncome"
                            type="number"
                            class="form-input"
                            value={formData.monthlyIncome}
                            onchange={handleInputChange}
                            data-field="monthlyIncome"
                            step="0.01"
                            min="0"
                            required
                        />
                        <template if:true={incomeError}>
                            <span class="validation-error">{incomeErrorMsg}</span>
                        </template>
                    </div>
                    <div class="form-group">
                        <label for="supportOption" class="form-label">Support Option<span class="required">*</span></label>
                        <lightning-combobox
                            name="supportOption"
                            label=""
                            value={formData.supportOption}
                            options={supportOptions}
                            onchange={handleInputChange}
                            required
                            class="form-combobox"
                        ></lightning-combobox>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" disabled={isLoading}>
                        <template if:true={isLoading}>
                            <lightning-spinner alternative-text="Loading"></lightning-spinner>
                            Submitting...
                        </template>
                        <template if:false={isLoading}>
                            Submit Application
                        </template>
                    </button>
                    <button type="reset" class="btn btn-secondary" disabled={isLoading} onclick={handleReset}>
                        Reset
                    </button>
                </div>
            </form>
        </template>

        <!-- Success State -->
        <template if:true={isSubmitted}>
            <div class="success-state">
                <lightning-icon icon-name="utility:success" class="success-icon" alternative-text="Success"></lightning-icon>
                <h2>Application Submitted Successfully!</h2>
                <p>Your grant application has been received. We will review it shortly.</p>
                <button class="btn btn-primary" onclick={handleNewApplication}>
                    Submit Another Application
                </button>
            </div>
        </template>
    </div>
     </lightning-card>
</template>
