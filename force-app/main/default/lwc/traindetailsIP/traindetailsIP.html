<template>
    <lightning-card title="Train Details" icon-name="utility:train">
        <!-- Input Section -->
        <div class="slds-p-horizontal_medium slds-p-vertical_small">
            <lightning-input
                label="Train Number"
                name="trainNo"
                type="text"
                value={trainNo}
                onchange={handleTrainNoChange}>
            </lightning-input>
            <div class="slds-m-top_small">
                <lightning-button
                    label="Fetch Train Details"
                    variant="brand"
                    onclick={fetchTrainDetailsHandler}>
                </lightning-button>
                <lightning-button
                    label="Reset"
                    variant="neutral"
                    onclick={handleReset}
                    class="slds-m-left_x-small">
                </lightning-button>
            </div>
        </div>

        <!-- Spinner -->
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_medium">
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <!-- Error Message -->
        <template if:true={error}>
            <div class="slds-text-color_error slds-p-horizontal_medium slds-m-top_medium">
                <p><strong>Error:</strong> {error}</p>
            </div>
        </template>

        <!-- Train Details Section -->
        <template if:true={datashow}>
            <div class="slds-p-horizontal_medium slds-p-vertical_medium">
                <h2 class="slds-text-heading_medium">{trainName}</h2>
                <p class="slds-text-body_small">Last Updated: {updatedTime}</p>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-top_medium">
                    <thead>
                        <tr class="slds-text-title_caps">
                            <th scope="col">Station Name</th>
                            <th scope="col">Platform</th>
                            <th scope="col">Halt</th>
                            <th scope="col">Delay</th>
                            <th scope="col">Timing</th>
                            <th scope="col">Distance</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={data} for:item="station">
                            <tr key={station.stationName}>
                                <td>{station.stationName}</td>
                                <td>{station.platform}</td>
                                <td>{station.halt}</td>
                                <td>{station.delay}</td>
                                <td>{station.timing}</td>
                                <td>{station.distance}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </lightning-card>


    <div class="slds-p-around_small">
        <lightning-button label="Get Train Details apex" variant="brand" onclick={handleTrainInfo}></lightning-button>
        <lightning-button label="Reset" variant="destructive" class="slds-p-around_small " onclick={reset}></lightning-button>
    </div>
</template>
