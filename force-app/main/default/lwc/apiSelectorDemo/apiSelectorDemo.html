<template>
    <lightning-card title="API Selector Demo" icon-name="standard:connected_apps">
        <div class="slds-p-around_medium">
            <api-selector onapiselected={handleApiSelected}></api-selector>
            
            <div class="slds-m-top_large" if:true={showResult}>
                <lightning-card variant="narrow" class="selected-api-card">
                    <div class="slds-p-around_small">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Selected API Details</h3>
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col">
                                <p><strong>API Type:</strong> {selectedApiType}</p>
                                <p><strong>API Label:</strong> {selectedApiLabel}</p>
                                <p><strong>Description:</strong> {selectedApiDescription}</p>
                            </div>
                        </div>
                        <div class="slds-m-top_medium">
                            <lightning-button 
                                label="Reset Selection" 
                                variant="neutral" 
                                onclick={handleReset}>
                            </lightning-button>
                        </div>
                    </div>
                </lightning-card>
            </div>
        </div>
    </lightning-card>
</template>
