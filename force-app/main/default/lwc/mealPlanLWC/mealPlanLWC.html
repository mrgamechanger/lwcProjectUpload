<template>
    <lightning-card title="Meal Plan Generator">
        <div class="slds-m-around_medium">
            <lightning-input 
                type="text" 
                label="Enter Your Query" 
                name="userInput" 
                value={userInput} 
                onchange={handleInputChange}>
            </lightning-input>
            <lightning-button 
                label="Get Meal Plan" 
                variant="brand" 
                onclick={fetchMealPlan} 
                class="slds-m-top_small">
            </lightning-button>
        </div>

        <template if:true={showSpinner}>
            <div class="slds-spinner_container">
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={mealPlanResponse}>
            <div class="slds-m-around_medium">
                <lightning-formatted-text value={mealPlanResponse}></lightning-formatted-text>
            </div>
        </template>
    </lightning-card>
</template>
