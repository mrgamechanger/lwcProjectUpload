<template>
    <template if:true={errors}>
        <div class="slds-box slds-theme_error">
            <p class="slds-text-heading_small">The following error(s) occurred:</p>
            <ul>
                <template for:each={errors} for:item="error">
                    <li key={error}>{error}</li>
                </template>
            </ul>
        </div>
    </template>
</template>
