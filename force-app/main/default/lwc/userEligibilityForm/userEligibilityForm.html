<template>
    <lightning-card title="CIBIL Score Email Sender" icon-name="standard:contact">
        <div class="slds-p-around_medium">
            <lightning-input label="Name" value={name} onchange={handleInputChange} required></lightning-input>
            <lightning-input label="Phone Number" value={phone} onchange={handleInputChange} required></lightning-input>
            <lightning-input label="Email" type="email" value={email} onchange={handleInputChange} required></lightning-input>
            <lightning-input label="CIBIL Score" type="number" value={cibilScore} onchange={handleInputChange} required></lightning-input>
            <lightning-button label="Submit" onclick={handleSubmit} class="slds-m-top_medium"></lightning-button>
        </div>
    </lightning-card>
</template>
