<template>
    <lightning-card title="Voice Search - Account & Contact" icon-name="utility:search">
        <div class="slds-p-around_medium">
            <!-- Search Input Section -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
                    <lightning-input
                        type="text"
                        label="Search Term"
                        value={searchTerm}
                        placeholder="Type or speak to search..."
                        onchange={handleSearchInputChange}
                        class="slds-m-bottom_small">
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                    <div class="slds-grid slds-gutters slds-m-top_large">
                        <div class="slds-col">
                            <lightning-button
                                label="Search"
                                variant="brand"
                                icon-name="utility:search"
                                onclick={handleSearchButtonClick}
                                disabled={!hasSearchTerm}
                                class="slds-m-right_x-small">
                            </lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button
                                label="Clear"
                                variant="neutral"
                                icon-name="utility:clear"
                                onclick={handleClearSearch}
                                class="slds-m-right_x-small">
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Voice Recognition Section -->
            <div class="slds-box slds-theme_shade slds-m-bottom_medium" if:true={isVoiceSupported}>
                <div class="slds-grid slds-grid_align-center">
                    <div class="slds-col slds-text-align_center">
                        <template if:true={isListening}>
                            <lightning-icon
                                icon-name="utility:mic"
                                size="large"
                                variant="error"
                                class="slds-m-bottom_small pulse-animation">
                            </lightning-icon>
                            <p class="slds-text-heading_small slds-text-color_error">Listening...</p>
                            <lightning-button
                                label="Stop Listening"
                                variant="destructive"
                                icon-name="utility:stop"
                                onclick={handleStopListening}
                                class="slds-m-top_small">
                            </lightning-button>
                        </template>
                        <template if:false={isListening}>
                            <lightning-icon
                                icon-name="utility:mic"
                                size="large"
                                variant="brand"
                                class="slds-m-bottom_small">
                            </lightning-icon>
                            <p class="slds-text-heading_small">Click to start voice search</p>
                            <lightning-button
                                label="Start Voice Search"
                                variant="brand"
                                icon-name="utility:mic"
                                onclick={handleStartListening}
                                class="slds-m-top_small">
                            </lightning-button>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Error Message -->
            <template if:true={errorMessage}>
                <div class="slds-box slds-theme_error slds-m-bottom_medium">
                    <div class="slds-text-color_error">
                        <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                        {errorMessage}
                    </div>
                </div>
            </template>

            <!-- Loading Spinner -->
            <template if:true={isSearching}>
                <div class="slds-align_absolute-center slds-m-vertical_large">
                    <lightning-spinner alternative-text="Searching..." size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Search Results -->
            <template if:true={hasResults}>
                <div class="slds-m-top_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">
                        Search Results ({searchResults.length})
                    </h3>
                    <div class="slds-box slds-theme_default">
                        <template for:each={searchResults} for:item="result">
                            <div key={result.id} class="slds-box slds-box_x-small slds-m-bottom_small result-item" 
                                 data-id={result.id} 
                                 data-type={result.type}
                                 onclick={handleRecordClick}>
                                <div class="slds-grid slds-gutters">
                                    <div class="slds-col slds-size_1-of-12">
                                        <lightning-icon
                                            icon-name={result.type === 'Account' ? 'standard:account' : 'standard:contact'}
                                            size="small"
                                            variant="brand">
                                        </lightning-icon>
                                    </div>
                                    <div class="slds-col slds-size_11-of-12">
                                        <div class="slds-grid slds-grid_vertical">
                                            <div class="slds-col">
                                                <p class="slds-text-heading_small slds-text-color_default">
                                                    <strong>{result.name}</strong>
                                                </p>
                                            </div>
                                            <div class="slds-col">
                                                <p class="slds-text-body_small slds-text-color_weak">
                                                    <lightning-badge label={result.type} class="slds-m-right_x-small"></lightning-badge>
                                                    <template if:true={result.subtitle}>
                                                        {result.subtitle}
                                                    </template>
                                                </p>
                                            </div>
                                            <div class="slds-col">
                                                <template if:true={result.phone}>
                                                    <lightning-icon icon-name="utility:phone_portrait" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                    <span class="slds-text-body_small slds-m-right_small">{result.phone}</span>
                                                </template>
                                                <template if:true={result.email}>
                                                    <lightning-icon icon-name="utility:email" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                    <span class="slds-text-body_small">{result.email}</span>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- No Results Message -->
            <template if:false={hasResults}>
                <template if:true={hasSearchTerm}>
                    <div class="slds-box slds-theme_shade slds-m-top_medium slds-text-align_center">
                        <lightning-icon icon-name="utility:info" size="small" class="slds-m-bottom_small"></lightning-icon>
                        <p class="slds-text-heading_small">No results found for "{searchTerm}"</p>
                    </div>
                </template>
            </template>

            <!-- Browser Support Message -->
            <template if:false={isVoiceSupported}>
                <div class="slds-box slds-theme_warning slds-m-top_medium">
                    <div class="slds-text-color_weak">
                        <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                        Voice search is not supported in your browser. Please use Chrome or Edge for voice search functionality.
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
