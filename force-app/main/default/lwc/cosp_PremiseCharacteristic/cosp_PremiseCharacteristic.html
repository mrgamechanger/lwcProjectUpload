<template>
    <lightning-card title="Premise Characteristics" class="slds-card slds-p-around_medium">
        <div class="slds-m-bottom_medium filter-section">
            <h2 class="slds-text-heading_medium">Filter Results</h2>
            <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                <!-- Minimum Date -->
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input 
                        type="date" 
                        label="Minimum Date" 
                        name="minDate" 
                        value={minDate} 
                        onchange={handleFilterChange}>
                    </lightning-input>
                </div>

                <!-- Maximum Date with error message -->
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input 
                        type="date" 
                        label="Maximum Date" 
                        name="maxDate" 
                        value={maxDate} 
                        onchange={handleFilterChange}
                        message-when-bad-input={maxDateError}>
                    </lightning-input>
                    <template if:true={maxDateError}>
                        <div class="slds-text-color_error slds-m-top_x-small">{maxDateError}</div>
                    </template>
                </div>

                <!-- Characteristic Type Description -->
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input 
                        type="text" 
                        label="Characteristic Type Description" 
                        name="filterTypeDescription" 
                        value={filterTypeDescription} 
                        onchange={handleFilterChange}>
                    </lightning-input>
                </div>
            </div>
        </div>
        
        <!-- Data Table Section -->
        <lightning-datatable
            key-field="id"
            data={displayData}
            columns={PremiseCharacteristicColumns}
            hide-checkbox-column="true"
            class="custom-datatable">
        </lightning-datatable>

        <!-- Show More Button -->
        <template if:true={showMoreVisible}>
            <div class="slds-m-top_medium slds-align_absolute-center">
                <lightning-button label="Show More" onclick={handleShowMore}></lightning-button>
            </div>
        </template>
    </lightning-card>
</template>
