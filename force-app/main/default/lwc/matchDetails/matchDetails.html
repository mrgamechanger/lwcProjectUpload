<template>
    <div class="slds-scope">
        <!-- Loading Spinner -->
        <template if:true={loading}>
            <div class="slds-is-relative slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error Message -->
        <template if:true={error}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                <span class="slds-assistive-text">error</span>
                <h2>{error}</h2>
            </div>
        </template>

        <!-- Match Details -->
        <template if:true={matchData}>
            <div class="slds-card slds-card_boundary">
                <!-- Header -->
                <div class="slds-card__header slds-grid">
                    <header>
                        <div class="slds-media slds-media_center">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:contest" size="medium" class="slds-m-right_medium"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h2 class="slds-card__header-title">
                                    <span class="slds-text-heading_large">{matchData.name}</span>
                                </h2>
                                <p class="slds-text-body_small slds-m-top_x-small">
                                    <lightning-icon icon-name="utility:date_input" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                    {formattedDate}
                                </p>
                            </div>
                        </div>
                    </header>
                </div>

                <!-- Match Status -->
                <div class="slds-card__body slds-card__body_inner">
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                        <div class="slds-grid slds-gutters slds-align_absolute-center">
                            <div class="slds-col slds-size_1-of-2 slds-text-align_center">
                                <h3 class="slds-text-heading_medium">{matchData.teams.0}</h3>
                                <p class="slds-text-heading_large slds-m-top_small">{team1Score}</p>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-text-align_center">
                                <h3 class="slds-text-heading_medium">{matchData.teams.1}</h3>
                                <p class="slds-text-heading_large slds-m-top_small">{team2Score}</p>
                            </div>
                        </div>
                        <div class="slds-text-align_center slds-m-top_medium">
                            <p class={matchStatusClass}>{matchData.status}</p>
                        </div>
                    </div>

                    <!-- Match Details Grid -->
                    <div class="slds-grid slds-wrap slds-gutters">
                        <!-- Venue -->
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                            <div class="slds-box slds-theme_shade">
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="utility:location" size="small" class="slds-m-right_small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h3 class="slds-text-heading_small">Venue</h3>
                                        <p class="slds-text-body_regular">{matchData.venue}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Match Type -->
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                            <div class="slds-box slds-theme_shade">
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h3 class="slds-text-heading_small">Match Type</h3>
                                        <p class="slds-text-body_regular">{matchData.matchType}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Toss Information -->
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                            <div class="slds-box slds-theme_shade">
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="utility:refresh" size="small" class="slds-m-right_small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h3 class="slds-text-heading_small">Toss</h3>
                                        <p class={tossInfoClass}>
                                            {matchData.tossWinner} won the toss and elected to {matchData.tossChoice}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Match Winner -->
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                            <div class="slds-box slds-theme_shade">
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="utility:trophy" size="small" class="slds-m-right_small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h3 class="slds-text-heading_small">Result</h3>
                                        <p class={matchWinnerClass}>{matchData.matchWinner}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Match Status -->
                    <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                        <div class="slds-col slds-size_1-of-1">
                            <div class="slds-box slds-theme_shade">
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="utility:clock" size="small" class="slds-m-right_small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h3 class="slds-text-heading_small">Match Status</h3>
                                        <div class="slds-grid slds-gutters slds-m-top_small">
                                            <div class="slds-col slds-size_1-of-2">
                                                <p class="slds-text-body_regular">
                                                    <strong>Started:</strong> {matchData.matchStarted}
                                                </p>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2">
                                                <p class="slds-text-body_regular">
                                                    <strong>Ended:</strong> {matchData.matchEnded}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="slds-card__footer">
                    <lightning-button 
                        label="Close" 
                        variant="brand" 
                        onclick={handleClose}>
                    </lightning-button>
                </footer>
            </div>
        </template>
    </div>
</template>
