<template>
    <lightning-card title="FLUX Image Generator" icon-name="custom:custom18">
        <div class="slds-p-around_medium">
            <lightning-input
                label="Enter Prompt"
                value={prompt}
                onchange={handlePromptChange}
                class="slds-m-bottom_medium">
            </lightning-input>

            <lightning-button
                label="Generate Image"
                variant="brand"
                onclick={handleGenerate}
                disabled={isLoading}>
            </lightning-button>

            <template if:true={isLoading}>
                <div class="slds-m-vertical_medium">
                    <lightning-spinner alternative-text="Generating..."></lightning-spinner>
                </div>
            </template>

            <template if:true={imageData}>
                <div class="slds-m-top_medium">
                    <img src={imageUrl} alt="Generated Image" class="generated-image"/>
                </div>
            </template>

            <template if:true={error}>
                <div class="slds-m-top_medium slds-text-color_error">
                    {error}
                </div>
            </template>
        </div>
    </lightning-card>
</template>
