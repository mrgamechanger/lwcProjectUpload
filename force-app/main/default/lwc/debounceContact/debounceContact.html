<template>
    <lightning-card title="Debounced Contact Search" icon-name="standard:contact">
        <div class="slds-p-around_medium">
            <lightning-input
                type="search"
                label="Search Contacts"
                onkeyup={searchNameHandler}
                placeholder="Start typing to search contacts..."
            ></lightning-input>

            <template if:true={error}>
                <p class="slds-text-color_error slds-p-top_small">{error}</p>
            </template>

            <template if:true={result.length}>
                <ul class="slds-has-dividers_bottom-space slds-p-top_small">
                    <template for:each={result} for:item="contact">
                        <li key={contact.Id} class="slds-item">
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col slds-size_1-of-2">
                                    <strong>{contact.Name}</strong>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    {contact.Email}
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>

            <template if:false={result.length}>
                <p class="slds-p-top_small">No contacts found.</p>
            </template>

            <lightning-button label="Reset" onclick={handleReset} class="slds-m-top_medium"></lightning-button>
        </div>
    </lightning-card>
</template>
