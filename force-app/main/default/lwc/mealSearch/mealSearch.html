<template>
    <lightning-card title="Meal Search" icon-name="standard:food_and_drink">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <lightning-input 
                        type="search" 
                        label="Search Meals" 
                        placeholder="Enter meal name..."
                        value={searchTerm}
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>
                
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <lightning-combobox
                        label="Filter by Area"
                        placeholder="Select an area"
                        value={selectedArea}
                        options={areaOptions}
                        onchange={handleAreaChange}
                        data-id="areaCombo">
                    </lightning-combobox>
                </div>
                
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <lightning-combobox
                        label="Filter by Category"
                        placeholder="Select a category"
                        value={selectedCategory}
                        options={categoryOptions}
                        onchange={handleCategoryChange}
                        data-id="categoryCombo">
                    </lightning-combobox>
                </div>
            </div>
            
            <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button 
                    label="Reset Filters" 
                    icon-name="utility:refresh" 
                    onclick={handleReset}
                    class="slds-m-left_x-small">
                </lightning-button>
            </div>

            <template if:true={meals}>
                <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                    <template for:each={paginatedMeals} for:item="meal">
                        <div key={meal.idMeal} class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <lightning-card>
                                <div class="slds-p-around_small meal-card" onclick={handleMealClick} data-meal-id={meal.idMeal}>
                                    <img src={meal.strMealThumb} alt={meal.strMeal} class="meal-image"/>
                                    <h2 class="slds-text-heading_small slds-m-top_small">{meal.strMeal}</h2>
                                    <p class="slds-text-body_small slds-m-top_x-small">{meal.strCategory}</p>
                                </div>
                            </lightning-card>
                        </div>
                    </template>
                </div>

                <template if:true={showPagination}>
                    <div class="slds-grid slds-grid_align-center slds-m-top_medium">
                        <div class="slds-col slds-size_1-of-2 slds-text-align_center">
                            <lightning-button-group>
                                <lightning-button 
                                    label="Previous" 
                                    icon-name="utility:chevronleft" 
                                    onclick={handlePreviousPage}
                                    disabled={isFirstPage}>
                                </lightning-button>
                                <lightning-button 
                                    label="Next" 
                                    icon-name="utility:chevronright" 
                                    icon-position="right"
                                    onclick={handleNextPage}
                                    disabled={isLastPage}>
                                </lightning-button>
                            </lightning-button-group>
                            <div class="slds-text-body_small slds-m-top_x-small">
                                Page {currentPage} of {totalPages}
                            </div>
                        </div>
                    </div>
                </template>
            </template>

            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-top_medium" role="alert">
                    {error}
                </div>
            </template>

            <template if:true={isLoading}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- Meal Details Modal -->
    <template if:true={showMealDetails}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large" aria-labelledby="modal-heading-01" aria-modal="true">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeMealDetails}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{selectedMeal.strMeal}</h2>
                </header>
                
                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <img src={selectedMeal.strMealThumb} alt={selectedMeal.strMeal} class="meal-detail-image"/>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-text-heading_small slds-m-bottom_small">Category: {selectedMeal.strCategory}</div>
                            <div class="slds-text-heading_small slds-m-bottom_small">Area: {selectedMeal.strArea}</div>
                            <div class="slds-text-heading_small slds-m-bottom_small">Tags: {selectedMeal.strTags}</div>
                        </div>
                    </div>
                    
                    <div class="slds-m-top_medium">
                        <div class="slds-text-heading_small slds-p-around_medium">Description:</div>
                        <div class="slds-box slds-theme_shade">
                            {selectedMeal.strInstructions}
                        </div>
                    </div>
                    
                    <template if:true={selectedMeal.strYoutube}>
                        <div class="slds-m-top_medium">
                            <div class="slds-text-heading_small slds-p-around_medium">Watch Recipe Video:</div>
                            <div class="slds-box slds-theme_shade">
                                <a href={selectedMeal.strYoutube} target="_blank" rel="noopener" class="slds-button slds-button_neutral">
                                    <lightning-icon icon-name="utility:video" class="slds-m-right_x-small"></lightning-icon>
                                    Watch on YouTube
                                </a>
                            </div>
                        </div>
                    </template>
                    
                    <div class="slds-m-top_medium">
                        <div class="slds-text-heading_small slds-p-around_medium">Ingredients:</div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <template for:each={ingredients} for:item="ingredient">
                                <div key={ingredient.id} class="slds-col slds-size_1-of-3 slds-p-bottom_small">
                                    <div class="slds-box slds-theme_shade slds-p-around_small">
                                        <div class="slds-text-heading_small">{ingredient.name}</div>
                                        <div class="slds-text-body_small">{ingredient.measure}</div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                
                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={closeMealDetails} class="slds-m-right_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
