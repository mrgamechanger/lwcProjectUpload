<template>
    <lightning-card title="Calculator Publisher">
        <div class="slds-p-around_medium">
            <lightning-input type="number" label="Amount on which these opreation will be performed" value={total} onchange={handleTotalChange}></lightning-input>
            <lightning-input type="number" label="Percentage of Amount" value={percentage} onchange={handlePercentageChange}></lightning-input>
            <lightning-input type="number" label="Discount on Amount" value={discount} onchange={handleDiscountChange}></lightning-input>
            <lightning-input type="number" label="Markup on Amount" value={markup} onchange={handleMarkupChange}></lightning-input>
            <!-- temperature calculator -->
            <lightning-input type="number" label="Temperature" value={temperature} onchange={handleTemperatureChange}></lightning-input>
            <lightning-radio-group
                label="Conversion"
                options={conversionOptions}
                value={conversion}
                onchange={handleConversionChange}
            ></lightning-radio-group>
            <div class="slds-p-around_small">
            <lightning-button variant="brand" class="slds-p-around_small" label="Calculate Percentage" onclick={handleCalculatePercentage} ></lightning-button>
            <lightning-button variant="brand" class="slds-p-around_small" label="Calculate Discount" onclick={handleCalculateDiscount} ></lightning-button>
            <lightning-button variant="brand" class="slds-p-around_small" label="Calculate Markup" onclick={handleCalculateMarkup}></lightning-button>
            <lightning-button variant="brand" class="slds-p-around_small" label="Convert Temperature" onclick={handleCalculateTemperature}></lightning-button>
        </div> </div>
    </lightning-card>
</template>
